[package]
name = "claudeye"
version = "0.5.1"
edition = "2024"
readme = "../../README.md"
description = "Claude session monitor overlay for tmux"
license = "MIT"
repository = "https://github.com/maedana/claudeye"

[[bin]]
name = "claudeye"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.60", features = ["derive"] }
crossterm = "0.28"
eframe = "0.30"
egui = "0.30"
ratatui = "0.29"
tmux-claude-state = { path = "../tmux-claude-state", version = "0.1.1" }
