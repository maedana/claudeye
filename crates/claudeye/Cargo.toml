[package]
name = "claudeye"
version = "0.7.0"
edition = "2024"
readme = "../../README.md"
description = "Claude session monitor overlay for tmux"
license = "MIT"
repository = "https://github.com/maedana/claudeye"
keywords = ["tmux", "claude", "monitor", "tui", "ai"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "claudeye"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.60", features = ["derive"] }
crossterm = "0.28"
eframe = "0.30"
egui = "0.30"
ratatui = "0.29"
libc = "0.2"
rmp = "0.8"
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tmux-claude-state = { path = "../tmux-claude-state", version = "0.1.4" }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2"
